<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>neo-nidhi | Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(145deg, #0f172a, #1e293b);
        color: #f8fafc;
      }
      .card {
        width: min(440px, 90vw);
        border-radius: 16px;
        padding: 24px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 20px 50px rgba(2, 6, 23, 0.45);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>
        neo-nidhi could not reach the network. Please reconnect and retry your
        action.
      </p>
    </main>
  </body>
</html>
